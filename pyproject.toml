[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "space-estimation-control"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["common*", "sensor_fusion*", "adcs*"]

[tool.pytest.ini_options]
testpaths = ["common", "sensor_fusion", "adcs"]
addopts = "-q"
